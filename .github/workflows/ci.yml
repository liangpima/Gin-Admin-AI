name: CI

# 触发：推送到主分支、以及所有 PR。
# 之前项目没有任何 CI，`go vet` 与前端类型检查都只靠本地自觉，
# 这是「改动质量全靠人」的根因。
on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支的新推送取消上一次未跑完的任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：两个 job 都只需要读仓库内容（actions/checkout）。
# 不声明的话 token 默认权限更宽 —— 属于「不需要却拿着」，
# 一旦某个依赖被投毒就能顺着它改仓库内容。
permissions:
  contents: read

jobs:
  backend:
    name: 后端（vet / test / build）
    runs-on: ubuntu-latest
    # 每个 job 都必须有超时上限。默认值是 360 分钟，一旦某一步卡住
    # （等 Redis 连接、go test 里有 goroutine 死锁、下载依赖无响应），
    # 这个 runner 会被占满 6 小时才释放，期间后续排队的工作流全部堵住。
    timeout-minutes: 20
    # ────────────────────────────────────────────────────────────
    # Redis：middleware 的 Auth 用例需要它才能覆盖「token 合法」之后的路径
    # （吊销检查 fail-closed 的取舍、平台级身份校验、用户级吊销）。
    # 不提供的话这些用例会走 t.Skip —— 恰恰是安全最关键的一段在 CI 上没测，
    # 而本地又跑得到，覆盖率数字会对不上。
    #
    # 用例侧用「连不上就 skip」而不是硬依赖，所以没有 Redis 的机器
    # （比如开发者本机没起 Redis）`go test ./...` 仍然能跑通。
    # ────────────────────────────────────────────────────────────
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ────────────────────────────────────────────────────────────
      # MySQL：迁移检查需要它，而且要真的**执行**迁移。
      #
      # 此前 CI 对迁移只做 `go build ./cmd/migrate` —— 证明它能编译，仅此而已。
      # 而「迁移写错」（漏判 information_schema、重复建索引、引用还不存在的列）
      # 编译期全都看不出来，要等上线执行时才炸。
      # ────────────────────────────────────────────────────────────
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 以 go.mod 为准，避免本地与 CI 版本漂移
          go-version-file: go.mod
          cache: true

      - name: 静态检查
        run: go vet ./...

      # ────────────────────────────────────────────────────────
      # swagger 文档一致性：**阻断项**。
      #
      # 为什么要这一步：`docs/` 是 `swag init` 的**生成物**，但它必须入库
      # （`cmd/server/main.go` 用 `_ "go-admin/docs"` 注册 swagger，
      # `.dockerignore` 也明确不能排除它），于是它成了典型的
      # 「没人会主动重新生成、改了接口也不报错」的东西。
      #
      # 这不是假设 —— 加这道门禁时实测：入库的文档已漂移到 38 个 path，
      # 其中 15 个指向**早已不存在的接口**（member 模块重构后的旧路径、
      # payment 的旧路径），而期间新增的接口一个都没进去。
      # 这类失效不会报错，只会让 swagger 页面越用越不可信。
      #
      # 用 `make swagger` 而不是手写命令：与本地跑的是同一条，
      # 避免「CI 绿了但本地其实是另一回事」（同前端构建那条注释）。
      #
      # ⚠️ 这一步只覆盖「生成物与注解是否一致」。**注解本身漏写**它查不出来 ——
      # 新接口一条注解都没写时，重新生成的结果与仓库里的完全相同，git diff 为空。
      # 「文档是否覆盖了每一条真实路由」「引用的安全方案是否都有定义」
      # 这两项由 `router/swagger_routes_test.go` 在 go test 阶段把关（同为阻断项）。
      # 此前那项核对是一个放在 runtime/（已 gitignore）下的一次性脚本，从未入库。
      #
      # 版本必须钉死：swag 不同版本生成的 docs.go 有差异，用 latest 会让 CI
      # 随上游发布随机变红 —— 与 golangci-lint 那次「观察项本身失效」同源。
      # 生成物是 LF（swag 在 Windows 与 Linux 都写 LF，仓库里存的也是 LF），
      # 因此不存在 Windows 本地与 Linux CI 因换行符差异而永久报红的问题。
      # ────────────────────────────────────────────────────────
      - name: 安装 swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: swagger 文档一致性
        run: |
          make swagger
          if ! git diff --exit-code -- docs/; then
            echo "::error::docs/ 与代码不一致。请在本地执行 make swagger 并提交生成的文档。"
            exit 1
          fi

      # ────────────────────────────────────────────────────────
      # 单元测试 + 覆盖率门槛：**阻断项**。
      #
      # 门槛防的是「静默倒退」，不是「数字不够高」—— 此前 CI 只跑 go test，
      # 新增生产代码不补测试、顺手删掉某个用例，都不会有任何信号。
      #
      # 门槛为什么不设 100%、阈值怎么定、本项目有意划出了哪些测试边界，
      # 都写在 scripts/check-coverage.sh 的头部注释里。
      # 调整阈值时必须同步更新本地规划文档 docs/review-fix-plan.md 里的实测值
      # （该文档按 .gitignore 不入库，只作过程记录）。
      #
      # -count=1 关掉测试结果缓存，否则改了代码也可能命中旧结果。
      # 用 `bash scripts/...` 而不是 `./scripts/...`：可执行位在 Windows
      # 检出后不一定保留，显式调 bash 两边都稳。
      # ────────────────────────────────────────────────────────
      # 破坏性变更检测（P2-6）：删除接口/响应字段、改类型、必填新增，
      # 必须在提交信息里带 [BREAKING] 才放行。故意破坏后跑
      # `make swagger-baseline` 固化新基线。
      - name: API 破坏性变更检测
        run: |
          git log -1 --format=%B > _commit_msg.txt
          python3 scripts/check_breaking_changes.py docs/swagger-baseline.json docs/swagger.json _commit_msg.txt

      - name: 单元测试与覆盖率门槛
        run: bash scripts/check-coverage.sh -count=1

      - name: 编译入口
        run: go build -o /dev/null ./cmd/server

      - name: 编译迁移工具
        run: go build -o /dev/null ./cmd/migrate

      # ────────────────────────────────────────────────────────
      # 部署文件静态校验：**阻断项**。
      #
      # 本环境无法真正 docker build，deploy/validate.py 做能做到的静态校验
      # （YAML、compose 引用完整性、构建上下文、Dockerfile 的 COPY 源、
      #  应用配置关键项、nginx 关键行为与安全响应头）。
      #
      # 接进来的理由不是「它有用」，而是它此前**从不被执行** ——
      # 一个只能手动跑、也不在任何门禁里的脚本，等于不存在。
      #
      # 其中 nginx 那条断言针对一个真实缺陷：`add_header` 在本层出现后就不再继承
      # 上层，于是带了 Cache-Control 的 location 会**静默丢掉** X-Frame-Options /
      # nosniff / Referrer-Policy。`location = /index.html` 正是后台主文档的
      # 响应者（`location /` 的 try_files 内部重定向到它），丢了 X-Frame-Options
      # 就等于整个后台可被第三方站点 iframe 嵌套（点击劫持）。
      # 这类失效不报错、不影响功能，只有抓响应头才看得出来，只能靠断言兜住。
      #
      # 用 `make check-deploy` 而不是直接调脚本：与本地跑的是同一条命令，
      # 且 PyYAML 缺失时的提示与本地一致。
      # ────────────────────────────────────────────────────────
      - name: 部署文件静态校验
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pyyaml
          make check-deploy

      # ────────────────────────────────────────────────────────
      # 迁移在真实 MySQL 上执行：**阻断项**。
      #
      # 三层验证（见 scripts/check-migrations.sh 头部注释）：
      #   ① init.sql 能在空库上跑通
      #   ② cmd/migrate 能把全部迁移应用，且再跑一次是 no-op
      #   ③ 把全部 .sql 原样重放 3 轮不报 ERROR（幂等）
      #
      # ③ 是核心：cmd/migrate 明确不做事务回滚（MySQL 的 DDL 会隐式提交，
      # 事务包不住），所以每个迁移脚本**必须幂等** —— 而幂等性只能靠真的
      # 跑第二遍发现，静态检查一点办法都没有。
      # ────────────────────────────────────────────────────────
      - name: 迁移在真实 MySQL 上执行
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MIGRATION_CHECK_DB: gin_migration_check
        run: bash scripts/check-migrations.sh

      # ────────────────────────────────────────────────────────
      # 依赖漏洞扫描：**阻断项**。
      #
      # 首轮基线是 35 个漏洞（2 个依赖模块 + 标准库），全部已修：
      # 升 Go 到 1.25.14（标准库那批的修复版本都在 1.25.2/1.25.3）+
      # x/text v0.39.0 / x/net v0.56.0 / excelize v2.11.0。
      #
      # 版本钉死：`@latest` 会随上游发布漂移，而「版本漂移导致观察项失效」
      # 本项目已经踩过两次（golangci-lint 因版本不兼容一直没在跑；
      # swag 用 latest 会让 docs.go 随机变红）。
      # ────────────────────────────────────────────────────────
      - name: 依赖漏洞扫描（govulncheck）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      # ────────────────────────────────────────────────────────
      # 密钥泄漏扫描：**阻断项**。
      #
      # 扫**全历史**而不是只扫工作区：密钥一旦提交过就删不掉了（历史会一直
      # 带着它），必须在合并前拦住，而不是等发现后再去改写历史。
      #
      # ⚠️ 不用 `gitleaks dir .`：实测它扫出 235 处「泄漏」，全部来自
      # node_modules 里的第三方测试夹具（507 MB 噪音）。那些目录本就不入库。
      #
      # 安装路径是 zricethezav/gitleaks —— 模块已迁移到 gitleaks/gitleaks，
      # 但**旧路径下发布的版本 go.mod 里声明的仍是旧路径**，
      # 用新路径 `go install` 会因 "declares its path as ..." 直接失败。
      # ────────────────────────────────────────────────────────
      - name: 密钥泄漏扫描（gitleaks）
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --no-banner --redact

  # ────────────────────────────────────────────────────────────
  # 数据竞争检测（-race）：**阻断项**。
  #
  # 为什么单独一个 job 而不是并进 backend：
  #  · -race 让测试耗时涨 2~5 倍，与 backend 并行跑才不会拖慢整体反馈
  #  · 失败时步骤名直接指向「数据竞争」，不必在一堆检查里翻
  #
  # 为什么这条**只能在 CI 上跑**：-race 需要 cgo（gcc），而本项目的开发机是
  # Windows 且没有 MinGW（`go env CGO_ENABLED` 为 0）—— 也就是说，
  # 这是仓库里少数几项「本地跑不了、只能靠 CI」的检查。
  #
  # 它针对的是框架里的并发热点：token 吊销、middleware 的角色缓存
  # （sync.RWMutex）、订单分片锁、会员编号计数器、平台证书缓存（限速+单飞）。
  # 这类缺陷的特征是「偶发、压测才现、事后解释不清」，静态审查抓不到。
  # ────────────────────────────────────────────────────────────
  race:
    name: 数据竞争检测（-race）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 刻意**不挂覆盖率门槛**：race 模式下覆盖率统计会显著变慢，
      # 而且这里要的是「有没有竞争」，不是「覆盖了多少」。
      - name: go test -race
        run: go test -race -count=1 ./...

  frontend:
    name: 前端（类型检查 / lint / 测试 / 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 ci 而不是 install：严格按 lock 文件安装，保证可重现
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # ────────────────────────────────────────────────────────
      # ESLint：**阻断项**，基线为 0（0 error / 0 warning）。
      #
      # 用 `--max-warnings 0` 而不是只挡 error：项目里 no-explicit-any 这类
      # 规则刻意保留在 warning 级别（编辑器标黄比标红合适），门槛交给 CI 表达。
      #
      # 与后端 golangci-lint 同样的教训：初版配置想用 strongly-recommended
      # 绕开格式规则，实测该假设不成立 —— 1794 条告警里 1787 条是格式类，
      # 真正的代码问题被淹没。现改由 eslint-config-prettier 显式关闭
      # 与 Prettier 冲突的规则（不手写清单，避免随插件版本漂移）。
      # ────────────────────────────────────────────────────────
      - name: 静态检查（ESLint）
        run: npm run lint

      - name: 单元测试（vitest）
        run: npm run test

      # 格式检查：**阻断项**。
      # 分两步走完了：先单独跑一次 `npm run format`（51 个文件，纯机械改动，
      # 便于 review），再把它接进来。之所以不一开始就阻断，是因为历史文件
      # 尚未按 .prettierrc 统一格式化，直接加会让 CI 长期红 ——
      # 长期红的检查等于没有检查。
      - name: 格式检查（Prettier）
        run: npm run format:check

      # ────────────────────────────────────────────────────────
      # 构建 + 产物体积门禁：**阻断项**。
      #
      # 刻意用 `npm run build` 而不是 `npx vite build`：
      # `build` 的定义是 `vue-tsc && vite build && node scripts/check-bundle.mjs`，
      # 让 CI 与本地跑的是**同一条命令**，避免「CI 绿了但本地 build 其实是另一回事」。
      #
      # 体积门禁为什么必须有：本次产物从 1.27 MB 悄悄涨到首屏 1.5 MB，
      # vite 的 chunk 警告一直有，但**警告不是门禁** —— 不阻断就没人看，
      # 和 P2-2 那个「lint 因版本不对根本没在检查、continue-on-error 又让它连失败
      # 都不显眼」是同一类失效。阈值与例外项见 web/scripts/check-bundle.mjs 头部注释。
      #
      # 上面那步 `类型检查` 与这里的 vue-tsc 有重叠（多花约 20s）：
      # 保留它只是为了失败时步骤名直接指向「类型检查」，定位更快。
      # ────────────────────────────────────────────────────────
      - name: 构建 + 产物体积门禁
        run: npm run build

      # ────────────────────────────────────────────────────────
      # 依赖漏洞扫描：**阻断项，但门槛定在 high**。
      #
      # 首轮基线 6 个（4 high / 2 moderate），其中 4 个 high 已由
      # `npm audit fix` 修掉（immutable / nanoid / postcss 等，均为非破坏性）。
      #
      # 剩下 2 个 moderate 来自 vitest 依赖的 @vitest/mocker，
      # 修复需要升到 vitest@5 —— 那是**破坏性升级**，要单独评估，
      # 不该被一个安全门禁推着做。所以门槛定在 high：
      # 高危阻断，中低危记录待观察。
      #
      # 这也意味着**不能**用 `--audit-level=moderate`：那会让 CI 长期红，
      # 而长期红的检查等于没有检查（本项目踩过两次）。
      # ────────────────────────────────────────────────────────
      - name: 依赖漏洞扫描（npm audit）
        run: npm audit --audit-level=high

  # ────────────────────────────────────────────────────────────
  # golangci-lint：**阻断项**。
  #
  # 2026-09-24 完成两件事后转为强制：
  #  1. 基线清零：29 项（errcheck 24 / staticcheck 4 / unused 1）全部修掉或豁免，
  #     配置见 .golangci.yml
  #  2. 修掉「观察项本身失效」的问题 —— 此前用的是 v6 action + `version: latest`，
  #     而 latest 解析到 golangci-lint v1.64.8（用 go1.24 构建），面对要求 go 1.25
  #     的 go.mod 会直接在加载阶段失败：
  #       "the Go language version (go1.24) used to build golangci-lint is lower
  #        than the targeted Go version (1.25.0)"
  #     也就是说这个任务此前一直没在真正检查代码，而 continue-on-error 让它
  #     连失败都不显眼 —— 观察项在观察项失效时是最危险的组合。
  #
  # 因此这里两处都钉死：
  #  · action 用 v8（v7 起才支持 golangci-lint v2，v6 只支持 v1）
  #  · lint 版本显式钉到本地验证过的 v2.13.2，不用 latest
  #    （latest 会随上游发布漂移，而版本漂移正是上面那个坑的成因）
  # ────────────────────────────────────────────────────────────
  lint:
    name: 静态检查（golangci-lint）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 第三方 action 必须钉到**不可变的 commit SHA**，不能钉 tag。
      #
      # 第一方 action（actions/checkout、actions/setup-go）钉大版本是可接受的
      # 惯例，但第三方仓库不同：tag 可以被上游（或入侵者）重新指向任意 commit，
      # 而 `@v8` 这种大版本 tag 本来就是"跟着漂移"的语义。
      # 一旦该仓库被投毒，CI 里会直接执行它带来的代码 —— 而 CI 持有
      # 仓库读写凭据，等于把供应链攻击面接到了本仓库上。
      #
      # 4afd733... 对应 golangci-lint-action v8.0.0（annotated tag
      # 25e2cdc5 指向的 commit）。升级时请同时更新 SHA 与下面的注释。
