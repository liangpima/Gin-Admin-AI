basePath: /api/v1
definitions:
  common.PageData:
    properties:
      list: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  common.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        minLength: 6
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  dto.CreateMemberLevelRequest:
    properties:
      discount:
        maximum: 10
        minimum: 1
        type: number
      icon:
        maxLength: 256
        type: string
      minPoints:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  dto.CreateMemberTagRequest:
    properties:
      color:
        maxLength: 20
        type: string
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  dto.CreateUserRequest:
    properties:
      deptId:
        type: integer
      email:
        type: string
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      phone:
        type: string
      postIds:
        items:
          type: integer
        type: array
      remark:
        maxLength: 500
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
      username:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - deptId
    - password
    - username
    type: object
  dto.LoginRequest:
    properties:
      captchaToken:
        description: |-
          CaptchaToken /captcha/verify 校验通过后返回的一次性凭证。
          必填：留空意味着攻击者可直接 POST /auth/login 绕过人机校验。
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captchaToken
    - password
    - username
    type: object
  dto.RefreshTokenRequest:
    properties:
      refreshToken:
        description: |-
          RefreshToken 待刷新的 refresh token。

          **刻意不是 `binding:"required"`**（P3-B2 起）：浏览器路径下它由 HttpOnly
          cookie 携带，而前端 JS 读不到 HttpOnly cookie，也就**不可能**把它放进请求体 ——
          请求体是空的。真正「有没有凭据」的判定在 Controller 里用
          authcookie.RefreshFromRequest 统一做（请求体优先、其次 cookie，
          两者都取不到才拒绝）。

          保留该字段是为了不破坏 Swagger / curl / 第三方这类显式传参的调用方。
          若哪天有人"顺手"把 required 加回来，现象是「浏览器端 token 一过期就被
          踢到登录页」—— 与 B4 要修的那个缺陷一模一样，极难怀疑到参数绑定这一层。
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      id:
        type: integer
      password:
        maxLength: 128
        minLength: 6
        type: string
    required:
    - id
    - password
    type: object
  dto.StatusRequest:
    properties:
      id:
        type: integer
      status:
        description: |-
          注意：不能用 required —— int8 的零值(0)会被 required 判为「未提供」，
          导致「停用」操作被参数校验直接拦下（返回 400）。
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateMemberLevelRequest:
    properties:
      discount:
        description: |-
          折扣率仍用浮点：它在库里就是浮点列，改整数需要迁移，
          且不参与金额计算（只作为展示与换算系数），风险低于改动面。
        maximum: 10
        minimum: 1
        type: number
      icon:
        maxLength: 256
        type: string
      id:
        type: integer
      minPoints:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateMemberTagRequest:
    properties:
      color:
        maxLength: 20
        type: string
      id:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateUserDeptRequest:
    properties:
      deptId:
        type: integer
      id:
        type: integer
    required:
    - deptId
    - id
    type: object
  dto.UpdateUserRequest:
    properties:
      deptId:
        type: integer
      email:
        type: string
      id:
        type: integer
      nickname:
        maxLength: 64
        type: string
      phone:
        type: string
      postIds:
        items:
          type: integer
        type: array
      remark:
        maxLength: 500
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateUserRolesRequest:
    properties:
      id:
        type: integer
      roleIds:
        items:
          type: integer
        type: array
    required:
    - id
    type: object
  model.DashboardStats:
    properties:
      configCount:
        type: integer
      deptCount:
        type: integer
      logCount:
        type: integer
      menuCount:
        type: integer
      postCount:
        type: integer
      roleCount:
        type: integer
      userCount:
        type: integer
    type: object
  vo.LoginResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  vo.MenuInfo:
    properties:
      children:
        items:
          $ref: '#/definitions/vo.MenuInfo'
        type: array
      component:
        type: string
      icon:
        type: string
      id:
        type: integer
      isCache:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      path:
        type: string
      redirect:
        type: string
      sort:
        type: integer
      title:
        type: string
      type:
        type: integer
      visible:
        type: integer
    type: object
  vo.RoleInfo:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  vo.UserInfoResponse:
    properties:
      avatar:
        type: string
      buttons:
        items:
          type: string
        type: array
      email:
        type: string
      id:
        type: integer
      menus:
        items:
          $ref: '#/definitions/vo.MenuInfo'
        type: array
      nickname:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/vo.RoleInfo'
        type: array
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Gin-Admin 后台管理系统 API 文档
  title: Gin-Admin API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
