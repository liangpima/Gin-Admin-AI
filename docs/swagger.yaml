basePath: /api/v1
definitions:
  common.PageData:
    properties:
      list: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  common.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        minLength: 6
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  dto.CreateMemberLevelRequest:
    properties:
      discount:
        maximum: 10
        minimum: 1
        type: number
      icon:
        maxLength: 256
        type: string
      minPoints:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  dto.CreateMemberRequest:
    properties:
      avatar:
        maxLength: 512
        type: string
      birthday:
        type: string
      gender:
        enum:
        - 0
        - 1
        - 2
        type: integer
      levelId:
        type: integer
      nickname:
        maxLength: 64
        type: string
      phone:
        type: string
      remark:
        maxLength: 500
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      tagIds:
        items:
          type: integer
        type: array
      username:
        maxLength: 64
        type: string
    required:
    - phone
    type: object
  dto.CreateMemberTagRequest:
    properties:
      color:
        maxLength: 20
        type: string
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  dto.CreateUserRequest:
    properties:
      deptId:
        type: integer
      email:
        type: string
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      phone:
        type: string
      postIds:
        items:
          type: integer
        type: array
      remark:
        maxLength: 500
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
      username:
        maxLength: 64
        minLength: 2
        type: string
    required:
    - deptId
    - password
    - username
    type: object
  dto.LoginRequest:
    properties:
      captchaToken:
        description: |-
          CaptchaToken /captcha/verify 校验通过后返回的一次性凭证。
          必填：留空意味着攻击者可直接 POST /auth/login 绕过人机校验。
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - captchaToken
    - password
    - username
    type: object
  dto.RefreshTokenRequest:
    properties:
      refreshToken:
        description: |-
          RefreshToken 待刷新的 refresh token。

          **刻意不是 `binding:"required"`**（P3-B2 起）：浏览器路径下它由 HttpOnly
          cookie 携带，而前端 JS 读不到 HttpOnly cookie，也就**不可能**把它放进请求体 ——
          请求体是空的。真正「有没有凭据」的判定在 Controller 里用
          authcookie.RefreshFromRequest 统一做（请求体优先、其次 cookie，
          两者都取不到才拒绝）。

          保留该字段是为了不破坏 Swagger / curl / 第三方这类显式传参的调用方。
          若哪天有人"顺手"把 required 加回来，现象是「浏览器端 token 一过期就被
          踢到登录页」—— 与 B4 要修的那个缺陷一模一样，极难怀疑到参数绑定这一层。
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      id:
        type: integer
      password:
        maxLength: 128
        minLength: 6
        type: string
    required:
    - id
    - password
    type: object
  dto.StatusRequest:
    properties:
      id:
        type: integer
      status:
        description: |-
          注意：不能用 required —— int8 的零值(0)会被 required 判为「未提供」，
          导致「停用」操作被参数校验直接拦下（返回 400）。
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateMemberLevelRequest:
    properties:
      discount:
        description: |-
          折扣率仍用浮点：它在库里就是浮点列，改整数需要迁移，
          且不参与金额计算（只作为展示与换算系数），风险低于改动面。
        maximum: 10
        minimum: 1
        type: number
      icon:
        maxLength: 256
        type: string
      id:
        type: integer
      minPoints:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateMemberRequest:
    properties:
      avatar:
        maxLength: 512
        type: string
      birthday:
        type: string
      gender:
        enum:
        - 0
        - 1
        - 2
        type: integer
      id:
        type: integer
      levelId:
        type: integer
      nickname:
        maxLength: 64
        type: string
      phone:
        type: string
      remark:
        maxLength: 500
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      tagIds:
        items:
          type: integer
        type: array
      username:
        maxLength: 64
        type: string
    required:
    - id
    type: object
  dto.UpdateMemberStatusRequest:
    properties:
      id:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateMemberTagRequest:
    properties:
      color:
        maxLength: 20
        type: string
      id:
        type: integer
      name:
        maxLength: 64
        type: string
      sort:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateMemberTagsRequest:
    properties:
      id:
        type: integer
      tagIds:
        items:
          type: integer
        type: array
    required:
    - id
    type: object
  dto.UpdateUserDeptRequest:
    properties:
      deptId:
        type: integer
      id:
        type: integer
    required:
    - deptId
    - id
    type: object
  dto.UpdateUserRequest:
    properties:
      deptId:
        type: integer
      email:
        type: string
      id:
        type: integer
      nickname:
        maxLength: 64
        type: string
      phone:
        type: string
      postIds:
        items:
          type: integer
        type: array
      remark:
        maxLength: 500
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
    required:
    - id
    type: object
  dto.UpdateUserRolesRequest:
    properties:
      id:
        type: integer
      roleIds:
        items:
          type: integer
        type: array
    required:
    - id
    type: object
  model.CaptchaVerifyRequest:
    properties:
      points:
        items:
          $ref: '#/definitions/model.Point'
        type: array
      token:
        type: string
    required:
    - points
    - token
    type: object
  model.DashboardStats:
    properties:
      configCount:
        type: integer
      deptCount:
        type: integer
      logCount:
        type: integer
      menuCount:
        type: integer
      postCount:
        type: integer
      roleCount:
        type: integer
      userCount:
        type: integer
    type: object
  model.Point:
    properties:
      x:
        type: integer
      "y":
        type: integer
    type: object
  vo.LoginResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  vo.MenuInfo:
    properties:
      children:
        items:
          $ref: '#/definitions/vo.MenuInfo'
        type: array
      component:
        type: string
      icon:
        type: string
      id:
        type: integer
      isCache:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      path:
        type: string
      redirect:
        type: string
      sort:
        type: integer
      title:
        type: string
      type:
        type: integer
      visible:
        type: integer
    type: object
  vo.RoleInfo:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  vo.UserInfoResponse:
    properties:
      avatar:
        type: string
      buttons:
        items:
          type: string
        type: array
      email:
        type: string
      id:
        type: integer
      menus:
        items:
          $ref: '#/definitions/vo.MenuInfo'
        type: array
      nickname:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/vo.RoleInfo'
        type: array
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Gin-Admin 后台管理系统 API 文档
  title: Gin-Admin API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/vo.LoginResponse'
              type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - ApiKeyAuth: []
      summary: 退出登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: RefreshToken（浏览器路径下可省略，凭据在 HttpOnly cookie 里）
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/vo.LoginResponse'
              type: object
      summary: 刷新Token
      tags:
      - 认证
  /auth/userInfo:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/vo.UserInfoResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户信息
      tags:
      - 认证
  /captcha/generate:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 生成点选验证码
      tags:
      - 验证码
  /captcha/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: 验证码 token 与点击坐标
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CaptchaVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 校验点选验证码
      tags:
      - 验证码
  /dashboard/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.DashboardStats'
              type: object
      summary: 获取统计数据
      tags:
      - 仪表盘
  /member:
    post:
      consumes:
      - application/json
      parameters:
      - description: 会员信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建会员
      tags:
      - 会员
    put:
      consumes:
      - application/json
      parameters:
      - description: 会员信息（含 id）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新会员
      tags:
      - 会员
  /member/{id}:
    delete:
      parameters:
      - description: 会员 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 删除会员
      tags:
      - 会员
    get:
      parameters:
      - description: 会员 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 会员详情
      tags:
      - 会员
  /member/level:
    post:
      consumes:
      - application/json
      parameters:
      - description: 等级信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMemberLevelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建会员等级
      tags:
      - 会员等级
    put:
      consumes:
      - application/json
      parameters:
      - description: 等级信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMemberLevelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新会员等级
      tags:
      - 会员等级
  /member/level/{id}:
    delete:
      parameters:
      - description: 等级ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 删除会员等级
      tags:
      - 会员等级
  /member/level/all:
    get:
      description: 给下拉选项用；`/member/level/list` 是分页版
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 全部会员等级（不分页）
      tags:
      - 会员等级
  /member/level/list:
    get:
      parameters:
      - description: 等级名称
        in: query
        name: name
        type: string
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 等级列表
      tags:
      - 会员等级
  /member/list:
    get:
      parameters:
      - description: 手机号
        in: query
        name: phone
        type: string
      - description: 昵称（模糊）
        in: query
        name: nickname
        type: string
      - description: 等级 ID
        in: query
        name: levelId
        type: integer
      - description: 状态：0 停用 / 1 正常
        in: query
        name: status
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 会员列表
      tags:
      - 会员
  /member/points/list:
    get:
      parameters:
      - description: 会员ID
        in: query
        name: memberId
        type: integer
      - description: 类型 1获取 2消费
        in: query
        name: type
        type: integer
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 积分明细列表
      tags:
      - 积分明细
  /member/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: 会员 ID 与目标状态
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMemberStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 启用 / 停用会员
      tags:
      - 会员
  /member/tag:
    post:
      consumes:
      - application/json
      parameters:
      - description: 标签信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMemberTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 创建会员标签
      tags:
      - 会员标签
    put:
      consumes:
      - application/json
      parameters:
      - description: 标签信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMemberTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新会员标签
      tags:
      - 会员标签
  /member/tag/{id}:
    delete:
      parameters:
      - description: 标签ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 删除会员标签
      tags:
      - 会员标签
  /member/tag/all:
    get:
      description: 给下拉选项用；`/member/tag/list` 是分页版
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 全部会员标签（不分页）
      tags:
      - 会员标签
  /member/tag/list:
    get:
      parameters:
      - description: 标签名称
        in: query
        name: name
        type: string
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 标签列表
      tags:
      - 会员标签
  /member/tags:
    put:
      consumes:
      - application/json
      parameters:
      - description: 会员 ID 与标签 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMemberTagsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 设置会员标签
      tags:
      - 会员
  /member/visit:
    put:
      consumes:
      - application/json
      parameters:
      - description: 会员 ID
        in: body
        name: id
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 更新最后访问时间
      tags:
      - 会员
  /pay/notify/alipay:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        由支付宝平台发起，**自行验签、不做登录鉴权**；请求体是渠道原始报文。
        响应为纯文本 `success` 或 `fail`，不是统一 Response 结构。
      produces:
      - text/plain
      responses:
        "200":
          description: success 或 fail
          schema:
            type: string
      summary: 支付宝支付回调
      tags:
      - 支付回调
  /pay/notify/wechat:
    post:
      consumes:
      - application/json
      description: |-
        由微信支付平台发起，**自行验签、不做登录鉴权**；请求体是渠道原始报文。
        响应为 `{"code":"SUCCESS"}` 或 `{"code":"FAIL","message":"处理失败"}`，
        不是统一 Response 结构（渠道侧只认它自己的约定）。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 微信支付回调
      tags:
      - 支付回调
