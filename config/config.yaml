server:
  # 监听地址。留空表示监听所有网卡（":8080"）。
  # 仅需本机访问时设为 127.0.0.1 —— debug 模式下调试入口全开，
  # 若同时监听所有网卡且 JWT 密钥仍为默认值，同网段任何人都能伪造 token。
  host: ""
  port: 8080
  mode: debug
  read_timeout: 60
  write_timeout: 60
  # 反向代理的 IP / CIDR 白名单，决定 X-Forwarded-For 是否可信。
  # 留空 [] 表示不信任任何代理头，ClientIP() 取连接对端地址（推荐默认）。
  # 部署在 nginx / SLB 之后时填其内网网段，例如 ["10.0.0.0/8"]；
  # 切勿填 0.0.0.0/0，那会让客户端可伪造 IP，绕过登录失败限频。
  trusted_proxies: []

database:
  host: 127.0.0.1
  port: 3306
  username: gin
  password: "123456" # 生产环境使用 DB_PASSWORD 环境变量覆盖
  dbname: gin
  max_idle_conns: 5
  max_open_conns: 50
  conn_max_lifetime: 300
  conn_max_idle_time: 120

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "change-me-in-production" # 生产环境使用 JWT_SECRET 环境变量覆盖
  access_expire: 7200
  refresh_expire: 604800

log:
  level: info
  filename: logs/app.log
  max_size: 200
  max_backups: 7
  max_age: 30
  compress: true
  # 数据库操作日志/登录日志的保留天数，超期由定时任务每天清理（<=0 表示不清理）
  db_retention_days: 90

upload:
  save_path: uploads/
  max_size: 10
  allow_exts: .jpg,.jpeg,.png,.gif,.bmp,.svg,.webp,.mp4,.mov,.mp3,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar

casbin:
  model_path: config/casbin/model.conf

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Tenant-Id"
    # 前端每次非 GET 请求都会带它（CSRF double-submit，见 internal/middleware/csrf.go）。
    # 自定义头会触发 CORS 预检，漏了它跨域部署下所有写操作都会被预检挡下。
    - "X-CSRF-Token"
  expose_headers:
    - "Content-Length"
    - "Content-Disposition"
  allow_credentials: true

security:
  # 登录限频在 Redis 不可用时的策略：
  #   true（默认）= 拒绝本次登录（fail-closed），与 token 吊销检查一致；
  #   false       = 放行（可用性优先，但限频会静默失效，仅日志留痕）。
  # 省略该项即为 true。
  login_fail_closed: true

  # token 的传输方式（P3-B1 引入）：
  #   header = 只认 Authorization 头，不下发 cookie（改造前的行为，也是回滚开关）
  #   both   = 头优先、其次 cookie（**默认**；省略该项即为此值）
  #   cookie = 只认 cookie（Swagger / curl 等不带 cookie 的调用方会失效）
  #
  # 取值写错会**拒绝启动**，不会静默回退 —— 静默回退会让
  # 「配了 cookie 却仍在读头」这类问题查很久。
  token_transport: both

  # cookie 是否带 Secure 属性（HTTPS 部署必须为 true）。
  #
  # 默认 false：本地开发走 http://localhost，带上 Secure 浏览器就不会保存 cookie，
  # 表现成「登录接口成功但下一次请求就是未登录」。
  # 上 HTTPS 后务必改成 true —— 启动日志会打印当前取值并附风险提示。
  cookie_secure: false

  # cookie 的 SameSite 属性，同时是 CSRF 的**主防线**：
  #   lax（默认）= 同源部署够用且最安全；跨站请求不带 cookie
  #   strict     = 最严，但会让「从外部链接点进来」丢掉登录态（本项目不推荐）
  #   none       = 跨站会携带 cookie，**必须**同时 cookie_secure: true，
  #                否则浏览器直接丢弃 cookie（配置校验会拒绝启动）
  # 只有前后端分域名部署时才需要 none，那时必须确认 B3 的 double-submit 已启用。
  cookie_same_site: lax
