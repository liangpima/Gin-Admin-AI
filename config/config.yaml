server:
  port: 8080
  mode: debug
  read_timeout: 60
  write_timeout: 60
  # 反向代理的 IP / CIDR 白名单，决定 X-Forwarded-For 是否可信。
  # 留空 [] 表示不信任任何代理头，ClientIP() 取连接对端地址（推荐默认）。
  # 部署在 nginx / SLB 之后时填其内网网段，例如 ["10.0.0.0/8"]；
  # 切勿填 0.0.0.0/0，那会让客户端可伪造 IP，绕过登录失败限频。
  trusted_proxies: []

database:
  host: 127.0.0.1
  port: 3306
  username: gin
  password: "123456" # 生产环境使用 DB_PASSWORD 环境变量覆盖
  dbname: gin
  max_idle_conns: 5
  max_open_conns: 50
  conn_max_lifetime: 300
  conn_max_idle_time: 120

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "change-me-in-production" # 生产环境使用 JWT_SECRET 环境变量覆盖
  access_expire: 7200
  refresh_expire: 604800

log:
  level: info
  filename: logs/app.log
  max_size: 200
  max_backups: 7
  max_age: 30
  compress: true
  # 数据库操作日志/登录日志的保留天数，超期由定时任务每天清理（<=0 表示不清理）
  db_retention_days: 90

upload:
  save_path: uploads/
  max_size: 10
  allow_exts: .jpg,.jpeg,.png,.gif,.bmp,.svg,.webp,.mp4,.mov,.mp3,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar

casbin:
  model_path: config/casbin/model.conf

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Tenant-Id"
  expose_headers:
    - "Content-Length"
    - "Content-Disposition"
  allow_credentials: true

security:
  # 登录限频在 Redis 不可用时的策略：
  #   true（默认）= 拒绝本次登录（fail-closed），与 token 吊销检查一致；
  #   false       = 放行（可用性优先，但限频会静默失效，仅日志留痕）。
  # 省略该项即为 true。
  login_fail_closed: true
