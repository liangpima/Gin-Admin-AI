# ============================================================
# 前端站点配置（由 web/Dockerfile 复制到 /etc/nginx/conf.d/default.conf）
#
# 三个关键决策：
#  1. /api 与 /uploads 反代到后端 —— 前端 baseURL 是 '/api/v1'（同源相对路径，
#     见 web/src/api/index.ts），同源部署下**不需要 CORS**，也就没有预检开销。
#  2. /uploads 必须走后端、不能映射本地目录 —— 后端在该路径上挂了
#     middleware.UploadSecurity()，会补 nosniff + CSP sandbox 响应头。
#     若 nginx 直接映射磁盘目录，白名单里的 .svg 就变成同源存储型 XSS 落点。
#  3. 未知路径回退 index.html —— 前端用 createWebHistory()（HTML5 history 模式），
#     不回落的话刷新任意子页面都会 404。
# ============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 上传接口按 upload.max_size（默认 10MB）留出余量；
    # 商品图片/视频等场景可上调，但后端 upload.MaxSize 才是最终闸门。
    client_max_body_size 20m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass         http://app:8080;
        # 注意：这里没有 `proxy_set_header Connection "";`，因此 nginx 对上游
        # 发的是 `Connection: close`（要开 upstream keepalive 必须显式清空该头）。
        #
        # 这一点曾经是个陷阱：带 body 的请求被后端提前拒绝（401/403/429）时，
        # net/http 会带着未读的请求体关闭连接 → 内核发 RST →
        # 已写出的 401/403 被丢弃，nginx 把它报成 502，前端拿不到真实状态码
        # （B4 的「401 → 续期 → 重放」因此根本不会触发）。
        # 后端已用 `middleware.DrainBody` 修掉（补读请求体后再关连接），
        # 所以**不需要**为了这个问题改这里。
        # 但若将来要开 upstream keepalive，仍需显式加 `proxy_set_header Connection "";`。
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 登录限频按 IP 计数（后端用 c.ClientIP()），必须把真实 IP 透传，
        # 否则所有请求都会被算成 nginx 容器的一个 IP，限频会误伤全部用户。
        proxy_set_header   X-Forwarded-Host  $host;

        # 支付网关回调、导出等接口可能较慢
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------------- 上传文件 ----------------
    # 走后端，保留 UploadSecurity() 的安全响应头（见文件头第 2 点）
    location /uploads/ {
        proxy_pass       http://app:8080;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 上传目录是匿名可读的静态资源，可长缓存
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------------- 构建产物 ----------------
    # vite 产物带内容 hash，可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不能被缓存：否则发版后浏览器仍加载旧的资源清单，
    # 表现为「白屏」或「部分页面加载旧代码」
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    off;
    }

    # ---------------- SPA 回退 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # 健康检查（容器探针用，不写访问日志）
    location = /healthz {
        access_log off;
        return     200 "ok\n";
        add_header Content-Type text/plain;
    }
}
