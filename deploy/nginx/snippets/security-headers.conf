# ============================================================
# 安全响应头 —— 由 default.conf 的各个 location 用 include 引入
#
# 【为什么单独成文件】
#   nginx 的 add_header 继承规则是：
#   **本层只要出现一条 add_header，就完全不继承上层的 add_header**。
#   所以在某个 location 里写 `add_header Cache-Control ...`，会让 server 级的
#   X-Frame-Options / X-Content-Type-Options / Referrer-Policy 一起失效。
#   这不报错、不影响功能，只有抓响应头才看得出来。
#
#   本项目踩过：`location = /index.html` 与 `location /assets/` 各自带了
#   Cache-Control，于是**后台主文档失去了 X-Frame-Options → 可被 iframe 嵌套
#   （点击劫持）**，/assets/ 也丢了 nosniff。而 `location /api/`、`location /`
#   因为没写 add_header，一直是好的 —— 这让人更容易误判「配置没问题」。
#
# 【为什么集中一份而不是逐处复制三行】
#   复制会漂移：新增 location 时漏三行不会有任何症状。集中后由
#   `deploy/validate.py` 断言「任何带 add_header 的 location 都必须 include 本文件」，
#   漏了就在校验里报错（该校验已接入 CI 与 `make check`）。
#
# 【always 是必需的】
#   不带 `always` 时 nginx 只为 2xx/3xx/204/304 添加响应头，
#   而 4xx/5xx 的错误页同样需要 nosniff（否则部分 UA 会嗅探内容类型）。
# ============================================================

add_header X-Content-Type-Options "nosniff"                      always;
add_header X-Frame-Options        "SAMEORIGIN"                   always;
add_header Referrer-Policy        "no-referrer-when-downgrade"   always;
