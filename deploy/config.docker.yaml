# ============================================================
# 容器环境配置（docker-compose.yml 会把它挂载为 /app/config/config.yaml）
#
# 与 config/config.yaml（本地开发用）的区别：
#   - mode: release            —— 关闭 Swagger 与 gin 调试输出
#   - database.host: mysql     —— 指向 compose 内的服务名
#   - redis.addr: redis:6379   —— 同上
#   - cors.allow_origins: 空   —— 同源部署，不需要跨域
#   - 密钥全部留空，由环境变量注入（DB_PASSWORD / JWT_SECRET / REDIS_PASSWORD）
#
# ⚠️ 密钥为什么留空而不是写默认值：
#    mode=release 时 config.ValidateSecurity() 会拒绝以默认密钥启动
#    （默认 JWT 密钥可被用来伪造任意用户身份）。留空 + 环境变量注入，
#    既避免了把密钥写进配置文件，也让"忘记配置"变成启动即失败，而不是带病运行。
# ============================================================

server:
  port: 8080
  mode: release
  read_timeout: 60
  write_timeout: 60
  # 本部署**确定**在 nginx 之后（见 deploy/nginx/default.conf 的 proxy_pass），
  # 因此必须声明可信代理网段，否则 X-Forwarded-For 一律不被采信，
  # c.ClientIP() 会退化成 nginx 容器的地址 —— 表现为：
  #   · 登录失败限频变成全站共用计数：任意 5 次失败即锁死所有人 15 分钟
  #   · 验证码生成限流（10 次/分钟）变成全站共用额度
  #   · 登录日志/操作日志里的来源 IP 全是 nginx 容器地址，审计失效
  #
  # 172.16.0.0/12 覆盖 docker 默认的 bridge/compose 网络网段
  # （172.16.0.0/12 = 172.16.0.0 ~ 172.31.255.255）。
  # 若 compose 显式指定了其它 subnet，请改成对应网段。
  # 切勿写 0.0.0.0/0：那等于信任任意客户端伪造的 X-Forwarded-For，
  # config.Validate 会直接拒绝启动。
  trusted_proxies:
    - "172.16.0.0/12"

database:
  host: mysql
  port: 3306
  username: gin
  # 由环境变量 DB_PASSWORD 覆盖（config.Init 中显式读取）
  password: ""
  dbname: gin
  max_idle_conns: 5
  max_open_conns: 50
  conn_max_lifetime: 300
  conn_max_idle_time: 120

redis:
  addr: redis:6379
  # 由环境变量 REDIS_PASSWORD 覆盖
  password: ""
  db: 0
  pool_size: 10

jwt:
  # 由环境变量 JWT_SECRET 覆盖
  secret: ""
  access_expire: 7200       # 2 小时
  refresh_expire: 604800    # 7 天

log:
  level: info
  filename: logs/app.log
  max_size: 200
  max_backups: 7
  max_age: 30
  compress: true
  db_retention_days: 90

upload:
  save_path: uploads/
  max_size: 10
  allow_exts: .jpg,.jpeg,.png,.gif,.bmp,.svg,.webp,.mp4,.mov,.mp3,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar

casbin:
  # 相对工作目录（容器内 WORKDIR=/app），与镜像里 COPY 的路径对应
  model_path: config/casbin/model.conf

cors:
  # 保持为空：前端由 nginx 同源托管并反代 /api，浏览器不会产生跨域请求。
  #
  # 启动日志里会出现一条 CORS 的 Error：
  #   [cors] 生产环境未配置 cors.allow_origins，将拒绝全部跨域请求
  # 这是**预期行为**（fail-closed 是刻意的），同源部署下无需处理。
  #
  # 仅当确实要从其他域名直接调用 API 时才添加来源，例如：
  #   - "https://admin.example.com"
  # 注意：绝不要写 "*"，配合 allow_credentials 会等价于对任意站点开放带凭证访问。
  allow_origins: []
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Tenant-Id"
    # 与 config/config.yaml 保持一致（前端每次非 GET 请求都会带这个头）。
    # 同源部署（nginx 反代 /api）不产生预检，因此漏配在本项目默认编排下
    # 不会暴露 —— 只在有人把前端挪到别的域名时才炸。
    - "X-CSRF-Token"
  expose_headers:
    - "Content-Length"
    - "Content-Disposition"
  allow_credentials: true

security:
  # ⚠️ 本段此前**完全缺失**（2026-09-25 补）：config/config.yaml 有、这里没有，
  #    而 mapstructure 遇到缺失的段会静默留零值 —— 表现为「本地开发是对的，
  #    容器里行为不一样」，且没有任何报错。TestConfigTemplatesParse 现在会断言取值。
  #
  # 登录限频在 Redis 不可用时的策略（true = 拒绝登录，fail-closed）。
  login_fail_closed: true

  # token 传输：both = Authorization 头优先、其次 cookie。
  # 这是 B1（后端双读 cookie）的默认值；出问题改回 header 即回到改造前行为。
  token_transport: both

  # ⚠️ 本编排是**纯 HTTP**（deploy/nginx/default.conf 只监听 80，
  #    通过 http://<host>:8080 访问），因此这里必须显式写 false。
  #    写成 true 会让浏览器直接丢弃 cookie，表现为「登录成功但立刻又是未登录」。
  #    接入 HTTPS（在 nginx 上终止 TLS）后，这里必须改成 true，
  #    并同步把 cookie_same_site 按部署形态复核一遍。
  cookie_secure: false

  # SameSite=lax：本编排前后端同源（nginx 同时托管前端并反代 /api），
  # 因此 lax 够用且最安全 —— 跨站请求不会带上认证 cookie。
  cookie_same_site: lax
